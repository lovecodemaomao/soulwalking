[project]
name = "soulwalking-agent"
version = "0.1.0"
description = "Personality-aware urban walking Agent for Nanjing Laomendong"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "chromadb>=1.0,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mcp>=1.27,<2",
  "openai>=1.100,<3",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "socksio>=1,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=5.0,<6"]
fieldwork = ["openpyxl>=3.1,<4"]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
